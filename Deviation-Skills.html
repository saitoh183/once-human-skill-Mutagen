<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Mutagen by Deviation & Shop</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #252525;
        --panel: #303030;
        --panel-2: #383838;
        --border: #5f5f5f;
        --text: #f2f2f2;
        --muted: #c7c7c7;
        --panel-card-bg: rgba(48, 48, 48, 0.78);
        --panel-border: #4f4f4f;
        --control-hover: #3f3f3f;
        --control-active-bg: rgba(255, 176, 0, 0.17);
        --input-bg: #3a3a3a;
        --image-bg: #242424;
        --deviation-cell-bg: #3a3a3a;
        --result-card-bg: #303030;
        --chip-bg: #262626;
        --empty-border: #646464;
        --editor-panel-bg: #2b2b2b;
        --danger-border: #d46a6a;
        --danger-bg: rgba(212, 106, 106, 0.2);
        --disabled-bg: #252525;
        --disabled-text: #9d9d9d;
        --disabled-border: #4a4a4a;
        --disabled-opacity: 0.72;
        --ok: #a8f0a8;
        --error: #ffabab;
        --legend-border: rgba(255, 255, 255, 0.28);
        --unlisted-skill: #333333;
        --skill-chip-border: #6a6a6a;
        --chip-common-inset: rgba(185, 150, 255, 0.24);
        --chip-searched-inset: rgba(255, 176, 0, 0.32);
        --check-dot-border: #6a983a;
        --shop-cat-bg: rgba(190, 190, 190, 0.24);
        --shop-cat-legend: rgba(190, 190, 190, 0.36);
        --shop-dino-bg: rgba(255, 140, 102, 0.24);
        --shop-dino-legend: rgba(255, 140, 102, 0.36);
        --shop-snow-bg: rgba(102, 178, 255, 0.24);
        --shop-snow-legend: rgba(102, 178, 255, 0.36);
        --shop-wish-bg: rgba(255, 204, 102, 0.24);
        --shop-wish-legend: rgba(255, 204, 102, 0.36);
        --focus-border: #b5b5b5;
        --focus-shadow: rgba(181, 181, 181, 0.22);
        --check: #4f764f;
        --check-dot: #9ad85a;
        --searched: #ffb000;
        --searched-bg: #ffd166;
        --searched-text: #1f1600;
        --common: #c7adff;
        --common-bg: #493a67;
        --skill-highlight: rgba(255, 105, 180, 0.52);
        --deviation-highlight: rgba(147, 112, 219, 0.52);
      }

      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f6f1e7;
        --panel: #fffaf0;
        --panel-2: #f1e6d3;
        --border: #8a7a63;
        --text: #1f2933;
        --muted: #475569;
        --panel-card-bg: rgba(255, 250, 240, 0.96);
        --panel-border: #b8aa94;
        --control-hover: #efe3cf;
        --control-active-bg: #fff0bd;
        --input-bg: #fffdf8;
        --image-bg: #eee4d3;
        --deviation-cell-bg: #efe3cf;
        --result-card-bg: #fffdf8;
        --chip-bg: #f4eadb;
        --empty-border: #9a8b75;
        --editor-panel-bg: #fff7ea;
        --danger-border: #a53e3e;
        --danger-bg: #ffe1df;
        --disabled-bg: #ebe1d0;
        --disabled-text: #5f6b7a;
        --disabled-border: #c2b49c;
        --disabled-opacity: 0.8;
        --ok: #146c2e;
        --error: #9f1d1d;
        --legend-border: rgba(31, 41, 51, 0.35);
        --unlisted-skill: #e5dccd;
        --skill-chip-border: #857762;
        --chip-common-inset: rgba(93, 58, 176, 0.2);
        --chip-searched-inset: rgba(138, 86, 0, 0.22);
        --check-dot-border: #1f5f23;
        --shop-cat-bg: #e5e1d8;
        --shop-cat-legend: #d2ccc0;
        --shop-dino-bg: #ffd9ca;
        --shop-dino-legend: #ffb99f;
        --shop-snow-bg: #d7ebff;
        --shop-snow-legend: #acd4ff;
        --shop-wish-bg: #fff0bf;
        --shop-wish-legend: #ffe08a;
        --focus-border: #5f4b32;
        --focus-shadow: rgba(95, 75, 50, 0.22);
        --check: #cfe7c8;
        --check-dot: #2f7d32;
        --searched: #8a5600;
        --searched-bg: #fff0b8;
        --searched-text: #3d2600;
        --common: #5d3ab0;
        --common-bg: #eadfff;
        --skill-highlight: rgba(196, 35, 107, 0.34);
        --deviation-highlight: rgba(93, 58, 176, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Quicksand', Arial, sans-serif;
      }

      .page-shell {
        width: min(1600px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 20px 0 36px;
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: 24px;
        font-weight: 700;
      }

      .app-header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .app-header h1 {
        grid-column: 2;
      }

      .theme-toggle {
        grid-column: 3;
        justify-self: end;
        min-width: 128px;
      }

      .tabs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 18px;
      }

      .tab-button,
      .control-button,
      .toggle-pill input + span {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      }

      .tab-button {
        padding: 10px 18px;
        font-weight: 700;
      }

      .tab-button:hover,
      .control-button:hover,
      .toggle-pill input + span:hover {
        background: var(--control-hover);
      }

      .tab-button.active,
      .toggle-pill input:checked + span {
        border-color: var(--searched);
        background: var(--control-active-bg);
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      .panel-card {
        background: var(--panel-card-bg);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 16px;
      }

      .matrix-search-container {
        margin: 0 auto 16px;
        max-width: 640px;
        text-align: center;
      }

      input[type='search'] {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        font-family: inherit;
      }

      input[type='search']:focus,
      select:focus,
      .editor-input:focus {
        outline: none;
        border-color: var(--focus-border);
        box-shadow: 0 0 0 2px var(--focus-shadow);
      }

      table {
        border-collapse: collapse;
        font-family: 'Quicksand', Arial, sans-serif;
        font-size: 12px;
        margin: 0 auto;
        border: 1px solid var(--border);
      }

      th,
      td {
        border: 1px solid var(--border);
        text-align: center;
        padding: 4px;
        vertical-align: middle;
      }

      th.skill-header {
        height: 200px;
        width: 24px;
        vertical-align: bottom;
        position: relative;
        padding: 0;
        cursor: pointer;
      }

      .rotated {
        writing-mode: vertical-lr;
        transform: rotate(180deg);
        white-space: nowrap;
        font-weight: normal;
        display: block;
        padding: 6px 4px;
        text-align: center;
        font-size: 11px;
      }

      th.deviation,
      td.deviation {
        width: 170px;
        text-align: left;
        font-weight: 700;
        padding: 8px;
        font-size: 14px;
        background-color: var(--deviation-cell-bg);
      }

      td.deviation {
        cursor: pointer;
      }

      .matrix-dev-cell {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .matrix-dev-cell img {
        width: 34px;
        height: 34px;
        object-fit: contain;
        border-radius: 6px;
        background: var(--image-bg);
      }

      .check {
        background-color: var(--check);
        position: relative;
      }

      .circle {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background-color: var(--check-dot);
        border: 1px solid var(--check-dot-border);
      }

      .cat-skill {
        background-color: var(--shop-cat-bg);
      }
      .dino-skill {
        background-color: var(--shop-dino-bg);
      }
      .snow-skill {
        background-color: var(--shop-snow-bg);
      }
      .wish-skill {
        background-color: var(--shop-wish-bg);
      }
      .multi-skill {
        background: linear-gradient(
          45deg,
          var(--shop-cat-bg),
          var(--shop-dino-bg),
          var(--shop-snow-bg),
          var(--shop-wish-bg)
        );
      }
      .unlisted-skill {
        background-color: var(--unlisted-skill);
      }

      .skill-highlight {
        background-color: var(--skill-highlight) !important;
      }
      .deviation-highlight {
        background-color: var(--deviation-highlight) !important;
      }

      .shop-legend {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 0;
        font-size: 12px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .legend-color {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      .cat-legend {
        background: var(--shop-cat-legend);
      }
      .dino-legend {
        background: var(--shop-dino-legend);
      }
      .snow-legend {
        background: var(--shop-snow-legend);
      }
      .wish-legend {
        background: var(--shop-wish-legend);
      }

      .search-hidden {
        opacity: 0.2;
        transition: opacity 0.2s ease-out;
      }
      .search-visible {
        opacity: 1;
        transition: opacity 0.2s ease-out;
      }

      .search-tools {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        align-items: end;
        margin-bottom: 16px;
      }

      .search-field {
        position: relative;
      }

      .search-suggestions {
        position: absolute;
        z-index: 20;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        max-height: min(360px, 55vh);
        overflow-y: auto;
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        background: var(--panel-bg);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.36);
        padding: 6px;
      }

      .search-suggestions[hidden] {
        display: none;
      }

      .suggestion-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 48px;
        padding: 7px 9px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .suggestion-item:hover,
      .suggestion-item:focus,
      .suggestion-item.active {
        outline: none;
        background: var(--chip-bg);
      }

      .suggestion-thumb {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        object-fit: contain;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: var(--image-bg);
      }

      .suggestion-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .field label,
      .toggle-group-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .toggle-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toggle-pill input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .toggle-pill input + span {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 8px 12px;
        user-select: none;
      }

      .result-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .legend-inline {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: flex-end;
      }

      .legend-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1px solid var(--legend-border);
      }

      .legend-swatch.searched {
        background: var(--searched-bg);
        border-color: var(--searched);
      }

      .legend-swatch.common {
        background: var(--common-bg);
        border-color: var(--common);
      }

      .results-grid {
        display: grid;
        gap: 12px;
      }

      .results-grid.vertical {
        grid-template-columns: 1fr;
      }

      .results-grid.horizontal {
        grid-auto-flow: column;
        grid-auto-columns: minmax(280px, 360px);
        overflow-x: auto;
        padding-bottom: 8px;
      }

      .result-card {
        min-width: 0;
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        background: var(--result-card-bg);
        padding: 12px;
      }

      .result-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .result-header img {
        width: 58px;
        height: 58px;
        object-fit: contain;
        border-radius: 10px;
        background: var(--image-bg);
        border: 1px solid var(--panel-border);
      }

      .result-card.deviation-result .result-header {
        align-items: flex-start;
      }

      .result-card.deviation-result .result-header img {
        width: clamp(76px, 10vw, 104px);
        height: clamp(76px, 10vw, 104px);
        padding: 4px;
      }

      .result-card.deviation-result .result-header h2 {
        font-size: clamp(20px, 2.2vw, 28px);
        line-height: 1.15;
      }

      .result-header h2 {
        margin: 0;
        font-size: 18px;
      }

      .skill-list {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .skill-chip {
        border: 1px solid var(--skill-chip-border);
        border-radius: 999px;
        padding: 5px 9px;
        background: var(--chip-bg);
        font-size: 12px;
        line-height: 1.1;
      }

      .skill-chip.common {
        border-color: var(--common);
        background: var(--common-bg);
        box-shadow: inset 0 0 0 1px var(--chip-common-inset);
      }

      .skill-chip.searched {
        border-color: var(--searched);
        background: var(--searched-bg);
        color: var(--searched-text);
        font-weight: 800;
        box-shadow: inset 0 0 0 1px var(--chip-searched-inset);
      }

      .empty-state {
        border: 1px dashed var(--empty-border);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }


      .editor-grid {
        display: grid;
        grid-template-columns: minmax(260px, 360px) 1fr;
        gap: 16px;
      }

      .editor-sidebar,
      .editor-main {
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        background: var(--editor-panel-bg);
        padding: 14px;
      }

      .editor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
      }

      .control-button {
        padding: 9px 12px;
        font-weight: 700;
      }

      .control-button:disabled,
      .editor-input:disabled,
      .editor-select:disabled,
      .skill-check input:disabled,
      .shop-checks input:disabled {
        cursor: not-allowed;
      }

      .control-button:disabled,
      .editor-input:disabled,
      .editor-select:disabled {
        border-color: var(--disabled-border);
        background: var(--disabled-bg);
        color: var(--disabled-text);
        opacity: var(--disabled-opacity);
      }

      .skill-check:has(input:disabled),
      .shop-checks label:has(input:disabled) {
        opacity: var(--disabled-opacity);
      }

      .danger-button {
        border-color: var(--danger-border);
        background: var(--danger-bg);
      }

      .editor-status {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        min-height: 18px;
      }

      .editor-status.ok {
        color: var(--ok);
      }

      .editor-status.error {
        color: var(--error);
      }

      .editor-main h2,
      .editor-sidebar h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .editor-select,
      .editor-input {
        width: 100%;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        font-family: inherit;
      }

      .editor-field {
        margin-bottom: 12px;
      }

      .editor-field label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .skill-checks {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 8px;
        max-height: 420px;
        overflow: auto;
        padding: 8px;
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        background: var(--bg);
      }

      .skill-check {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px;
        border-radius: 8px;
        background: var(--result-card-bg);
        font-size: 13px;
      }

      .shop-checks {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .shop-checks label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text);
        font-size: 13px;
        text-transform: none;
      }

      @media (max-width: 860px) {
        .app-header {
          grid-template-columns: 1fr;
        }

        .app-header h1,
        .theme-toggle {
          grid-column: 1;
          justify-self: center;
        }

        .search-tools,
        .editor-grid {
          grid-template-columns: 1fr;
        }

        .result-meta {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <header class="app-header">
        <h1>Once Human Skill Mutagen</h1>
        <button class="control-button theme-toggle" type="button" id="themeToggle" aria-pressed="false">Light mode</button>
      </header>

      <nav class="tabs" aria-label="Views">
        <button class="tab-button active" type="button" data-tab="matrix-panel">Current Table</button>
        <button class="tab-button" type="button" data-tab="search-panel">Deviation / Skill Search</button>
        <button class="tab-button" type="button" data-tab="editor-panel">Database Editor</button>
      </nav>

      <section id="matrix-panel" class="tab-panel active">
        <div class="matrix-search-container">
          <input
            type="search"
            id="matrixSearchBox"
            placeholder="Filter current table by skills or deviations..."
            autocomplete="off"
          />
        </div>

        <div style="overflow-x: auto">
          <table id="skillMatrix">
            <thead>
              <tr>
                <th class="deviation">
                  <div class="shop-legend">
                    <div class="legend-item"><div class="legend-color cat-legend"></div><span>Cat Shop</span></div>
                    <div class="legend-item"><div class="legend-color dino-legend"></div><span>Dino Shop</span></div>
                    <div class="legend-item"><div class="legend-color snow-legend"></div><span>Snow Shop</span></div>
                    <div class="legend-item"><div class="legend-color wish-legend"></div><span>Wish Shop</span></div>
                  </div>
                </th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="search-panel" class="tab-panel">
        <div class="panel-card">
          <div class="search-tools">
            <div class="field search-field">
              <label for="resultSearchBox">Search</label>
              <input
                type="search"
                id="resultSearchBox"
                placeholder="Type a deviation or skill..."
                autocomplete="off"
                aria-autocomplete="list"
                aria-controls="searchSuggestions"
                aria-expanded="false"
              />
              <div id="searchSuggestions" class="search-suggestions" role="listbox" hidden></div>
            </div>

            <div>
              <div class="toggle-group-label">Search by</div>
              <div class="toggle-group" role="radiogroup" aria-label="Search mode">
                <label class="toggle-pill"><input type="radio" name="searchMode" value="deviation" checked /><span>Deviation</span></label>
                <label class="toggle-pill"><input type="radio" name="searchMode" value="skill" /><span>Skill</span></label>
              </div>
            </div>

            <div>
              <div class="toggle-group-label">Layout</div>
              <div class="toggle-group" role="radiogroup" aria-label="Result layout">
                <label class="toggle-pill"><input type="radio" name="layoutMode" value="vertical" checked /><span>Vertical</span></label>
                <label class="toggle-pill"><input type="radio" name="layoutMode" value="horizontal" /><span>Horizontal</span></label>
              </div>
            </div>
          </div>

          <div class="result-meta">
            <div id="resultCount">Enter a search term.</div>
            <div class="legend-inline">
              <span class="legend-chip"><span class="legend-swatch searched"></span>Searched skill</span>
              <span class="legend-chip"><span class="legend-swatch common"></span>Common to all results</span>
            </div>
          </div>

          <div id="results" class="results-grid vertical"></div>
        </div>
      </section>

      <section id="editor-panel" class="tab-panel">
        <div class="panel-card">
          <div class="result-meta">
            <div id="databaseStatus">Database source: loading...</div>
            <div class="editor-actions">
              <button class="control-button" type="button" id="unlockEditorButton">Unlock editor</button>
              <button class="control-button" type="button" id="reloadDatabaseButton">Reload DB</button>
              <button class="control-button" type="button" id="saveDatabaseButton">Save DB</button>
            </div>
          </div>

          <div class="editor-grid">
            <aside class="editor-sidebar">
              <h2>Deviation</h2>
              <div class="editor-field">
                <label for="editorDeviationSelect">Select deviation</label>
                <select id="editorDeviationSelect" class="editor-select"></select>
              </div>
              <div class="editor-field">
                <label for="editorDeviationName">Name</label>
                <input id="editorDeviationName" class="editor-input" type="text" />
              </div>
              <div class="editor-field">
                <label for="editorDeviationImage">Image URL</label>
                <input id="editorDeviationImage" class="editor-input" type="url" />
              </div>
              <div class="editor-actions">
                <button class="control-button" type="button" id="addDeviationButton">Add deviation</button>
                <button class="control-button" type="button" id="updateDeviationButton">Update deviation</button>
                <button class="control-button danger-button" type="button" id="removeDeviationButton">Remove deviation</button>
              </div>
              <div id="editorStatus" class="editor-status"></div>
            </aside>

            <section class="editor-main">
              <h2>Skills & Associations</h2>
              <div class="editor-field">
                <label for="newSkillName">Add skill and associate with selected deviation</label>
                <input id="newSkillName" class="editor-input" type="text" placeholder="New skill name" />
              </div>
              <div class="editor-field">
                <label>Shop/source for new or selected skill</label>
                <div class="shop-checks">
                  <label><input type="checkbox" value="cat" class="shop-checkbox" /> Cat</label>
                  <label><input type="checkbox" value="dino" class="shop-checkbox" /> Dino</label>
                  <label><input type="checkbox" value="snow" class="shop-checkbox" /> Snow</label>
                  <label><input type="checkbox" value="wish" class="shop-checkbox" /> Wish</label>
                </div>
              </div>
              <div class="editor-actions">
                <button class="control-button" type="button" id="addSkillButton">Add skill to deviation</button>
                <button class="control-button danger-button" type="button" id="removeSkillButton">Remove selected skill globally</button>
              </div>
              <div class="editor-field">
                <label>Correct skill associations for selected deviation</label>
                <div id="skillAssociationList" class="skill-checks"></div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script src="data/deviation-database.js"></script>
    <script>
      'use strict';

      const staticDatabase = window.DEVIATION_SKILL_DATABASE;
      let database = typeof structuredClone === 'function' ? structuredClone(staticDatabase) : JSON.parse(JSON.stringify(staticDatabase));
      let deviations = database.deviations;
      let shops = database.shops;
      let allSkills = [];
      let fullSkillList = [];
      let editKey = localStorage.getItem('skillMutagenEditKey') || '';
      let editorLocked = true;
      let selectedGlobalSkill = '';

      function rebuildIndexes() {
        deviations = database.deviations;
        shops = database.shops;
        allSkills = [...new Set(Object.values(shops).flat())];
        fullSkillList = [...new Set([...allSkills, ...deviations.flatMap((deviation) => deviation.skills)])]
          .sort((a, b) => a.localeCompare(b));
      }

      rebuildIndexes();

      const normalize = (value) => value.toLowerCase().replace(/[^a-z0-9]+/g, '');
      const fuzzy = (value) => value.toLowerCase().trim();
      const hasText = (value, term) => fuzzy(value).includes(fuzzy(term));

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getShopClasses(skill) {
        const classes = [];
        if (shops.cat.includes(skill)) classes.push('cat-skill');
        if (shops.dino.includes(skill)) classes.push('dino-skill');
        if (shops.snow.includes(skill)) classes.push('snow-skill');
        if (shops.wish.includes(skill)) classes.push('wish-skill');
        return classes;
      }

      function applyShopClass(element, skill) {
        const classes = getShopClasses(skill);
        if (classes.length > 1) {
          element.classList.add('multi-skill');
        } else if (classes.length === 1) {
          element.classList.add(classes[0]);
        } else {
          element.classList.add('unlisted-skill');
        }
      }

      function initTheme() {
        const button = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('skillMutagenTheme');
        const systemPrefersLight = window.matchMedia?.('(prefers-color-scheme: light)').matches;
        const initialTheme = savedTheme || (systemPrefersLight ? 'light' : 'dark');

        function applyTheme(theme) {
          const isLight = theme === 'light';
          document.documentElement.dataset.theme = theme;
          button.textContent = isLight ? 'Dark mode' : 'Light mode';
          button.setAttribute('aria-pressed', String(isLight));
          localStorage.setItem('skillMutagenTheme', theme);
        }

        applyTheme(initialTheme);
        button.addEventListener('click', () => {
          applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
        });
      }

      function initTabs() {
        document.querySelectorAll('.tab-button').forEach((button) => {
          button.addEventListener('click', () => {
            document.querySelectorAll('.tab-button').forEach((item) => item.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach((panel) => panel.classList.remove('active'));
            button.classList.add('active');
            document.getElementById(button.dataset.tab).classList.add('active');
          });
        });
      }

      function buildMatrix() {
        const table = document.getElementById('skillMatrix');
        const theadRow = table.querySelector('thead tr');
        const tbody = table.querySelector('tbody');
        while (theadRow.children.length > 1) theadRow.removeChild(theadRow.lastElementChild);
        tbody.innerHTML = '';

        fullSkillList.forEach((skill, index) => {
          const th = document.createElement('th');
          th.className = 'skill-header';
          applyShopClass(th, skill);
          th.innerHTML = `<div class="rotated">${escapeHtml(skill)}</div>`;
          th.addEventListener('click', () => highlightSkillColumn(index, th));
          theadRow.appendChild(th);
        });

        deviations.forEach((deviation) => {
          const row = document.createElement('tr');
          const devCell = document.createElement('td');
          devCell.className = 'deviation';
          devCell.innerHTML = `
            <div class="matrix-dev-cell">
              <img src="${escapeHtml(deviation.image)}" alt="" loading="lazy" />
              <span>${escapeHtml(deviation.name)}</span>
            </div>`;
          devCell.addEventListener('click', () => highlightDeviation(row, deviation));
          row.appendChild(devCell);

          const skillSet = new Set(deviation.skills.map(normalize));
          fullSkillList.forEach((skill) => {
            const cell = document.createElement('td');
            if (skillSet.has(normalize(skill))) {
              cell.classList.add('check');
              cell.innerHTML = '<div class="circle"></div>';
            }
            row.appendChild(cell);
          });

          tbody.appendChild(row);
        });
      }

      function clearAllHighlights() {
        document.querySelectorAll('#skillMatrix tbody tr').forEach((row) => {
          row.classList.remove('deviation-highlight');
        });
        document.querySelectorAll('#skillMatrix tbody td').forEach((cell) => {
          cell.classList.remove('skill-highlight', 'deviation-highlight');
        });
        document.querySelectorAll('#skillMatrix thead th.skill-header').forEach((th) => {
          th.classList.remove('skill-highlight');
        });
      }

      function highlightSkillColumn(index, header) {
        clearAllHighlights();
        document.querySelectorAll(`#skillMatrix tbody tr td:nth-child(${index + 2})`).forEach((cell) => {
          cell.classList.add('skill-highlight');
          if (cell.querySelector('.circle')) {
            cell.parentElement.classList.add('deviation-highlight');
          }
        });
        header.classList.add('skill-highlight');
      }

      function highlightDeviation(row, deviation) {
        clearAllHighlights();
        row.classList.add('deviation-highlight');
        const theadRow = document.querySelector('#skillMatrix thead tr');
        const deviationSkillSet = new Set(deviation.skills.map(normalize));
        fullSkillList.forEach((skill, index) => {
          if (!deviationSkillSet.has(normalize(skill))) return;
          const header = theadRow.children[index + 1];
          if (header) header.classList.add('skill-highlight');
          document.querySelectorAll(`#skillMatrix tbody tr td:nth-child(${index + 2})`).forEach((cell) => {
            cell.classList.add('skill-highlight');
          });
        });
      }

      function initMatrixSearch() {
        const searchBox = document.getElementById('matrixSearchBox');

        const setVisible = (element, visible) => {
          element.classList.toggle('search-visible', visible);
          element.classList.toggle('search-hidden', !visible);
        };

        function updateSearch() {
          const thList = Array.from(document.querySelectorAll('#skillMatrix thead th.skill-header'));
          const thSkillNames = thList.map((th) => th.querySelector('.rotated').textContent.toLowerCase());
          const searchTerm = searchBox.value.toLowerCase().trim();
          if (!searchTerm) {
            document.querySelectorAll('#skillMatrix tbody tr').forEach((row) => setVisible(row, true));
            thList.forEach((th) => setVisible(th, true));
            return;
          }

          const skillMatches = new Set(thSkillNames.filter((name) => name.includes(searchTerm)));
          const isSkillQuery = skillMatches.size > 0;

          document.querySelectorAll('#skillMatrix tbody tr').forEach((row) => {
            const deviationName = row.querySelector('td.deviation').textContent.toLowerCase();
            const rowSkills = Array.from(row.querySelectorAll('td .circle')).map((circle) => {
              const colIndex = circle.closest('td').cellIndex;
              return document
                .querySelector(`#skillMatrix thead th:nth-child(${colIndex + 1}) .rotated`)
                .textContent.toLowerCase();
            });

            const matchesDeviation = deviationName.includes(searchTerm);
            const matchesSkillLoose = rowSkills.some((skill) => skill.includes(searchTerm));
            const matchesSkillDirect = rowSkills.some((skill) => skillMatches.has(skill));
            setVisible(row, isSkillQuery ? matchesSkillDirect || matchesDeviation : matchesDeviation || matchesSkillLoose);
          });

          const visibleSkillSet = new Set();
          document.querySelectorAll('#skillMatrix tbody tr.search-visible').forEach((row) => {
            Array.from(row.querySelectorAll('td .circle')).forEach((circle) => {
              const colIndex = circle.closest('td').cellIndex;
              visibleSkillSet.add(
                document.querySelector(`#skillMatrix thead th:nth-child(${colIndex + 1}) .rotated`).textContent.toLowerCase()
              );
            });
          });

          thList.forEach((th, index) => {
            const name = thSkillNames[index];
            setVisible(th, isSkillQuery ? skillMatches.has(name) : visibleSkillSet.has(name));
          });
        }

        let searchTimeout;
        searchBox.addEventListener('input', () => {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(updateSearch, 120);
        });
      }

      async function loadHostedDatabase() {
        const status = document.getElementById('databaseStatus');
        try {
          const response = await fetch('/api/database', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          if (payload.database) {
            database = payload.database;
            rebuildIndexes();
            status.textContent = `Database source: Cloudflare D1${payload.updated_at ? ` (updated ${payload.updated_at})` : ''}`;
            return;
          }
          status.textContent = 'Database source: local static fallback (Cloudflare DB is empty)';
        } catch (error) {
          status.textContent = `Database source: local static fallback (${error.message})`;
        }
      }

      function refreshRenderedData() {
        rebuildIndexes();
        buildMatrix();
        updateSearchSuggestions();
        renderResults();
        populateEditor();
      }

      function getSearchSuggestionItems() {
        const mode = document.querySelector('input[name="searchMode"]:checked').value;
        if (mode === 'deviation') {
          return deviations
            .map((deviation) => ({ label: deviation.name, image: deviation.image }))
            .sort((a, b) => a.label.localeCompare(b.label));
        }
        return fullSkillList
          .map((skill) => ({ label: skill, image: '' }))
          .sort((a, b) => a.label.localeCompare(b.label));
      }

      function closeSearchSuggestions() {
        const searchBox = document.getElementById('resultSearchBox');
        const suggestions = document.getElementById('searchSuggestions');
        suggestions.hidden = true;
        searchBox.setAttribute('aria-expanded', 'false');
      }

      function updateSearchSuggestions() {
        const searchBox = document.getElementById('resultSearchBox');
        const suggestions = document.getElementById('searchSuggestions');
        const mode = document.querySelector('input[name="searchMode"]:checked').value;
        const searchTerm = searchBox.value.trim();
        const items = getSearchSuggestionItems()
          .filter((item) => !searchTerm || hasText(item.label, searchTerm))
          .slice(0, 10);

        searchBox.placeholder = mode === 'deviation' ? 'Type a deviation...' : 'Type a skill...';
        if (items.length === 0) {
          suggestions.innerHTML = '';
          closeSearchSuggestions();
          return;
        }

        suggestions.innerHTML = items.map((item, index) => {
          const thumbnail = mode === 'deviation'
            ? `<img class="suggestion-thumb" src="${escapeHtml(item.image)}" alt="" loading="lazy" />`
            : '';
          return `
            <button class="suggestion-item" type="button" role="option" data-value="${escapeHtml(item.label)}" id="searchSuggestion-${index}">
              ${thumbnail}
              <span class="suggestion-label">${escapeHtml(item.label)}</span>
            </button>`;
        }).join('');
        suggestions.hidden = document.activeElement !== searchBox && !suggestions.contains(document.activeElement);
        searchBox.setAttribute('aria-expanded', String(!suggestions.hidden));
      }

      function selectSearchSuggestion(value) {
        const searchBox = document.getElementById('resultSearchBox');
        searchBox.value = value;
        closeSearchSuggestions();
        renderResults();
      }

      function moveSearchSuggestion(direction) {
        const suggestions = document.getElementById('searchSuggestions');
        const items = [...suggestions.querySelectorAll('.suggestion-item')];
        if (suggestions.hidden || items.length === 0) return;
        const currentIndex = items.indexOf(document.activeElement);
        const nextIndex = currentIndex === -1
          ? (direction > 0 ? 0 : items.length - 1)
          : (currentIndex + direction + items.length) % items.length;
        items[nextIndex].focus();
      }

      function initResultSearch() {
        const searchBox = document.getElementById('resultSearchBox');
        const suggestions = document.getElementById('searchSuggestions');
        const inputs = document.querySelectorAll('input[name="searchMode"], input[name="layoutMode"]');

        inputs.forEach((input) => input.addEventListener('change', () => {
          updateSearchSuggestions();
          renderResults();
        }));
        searchBox.addEventListener('input', () => {
          updateSearchSuggestions();
          renderResults();
        });
        searchBox.addEventListener('focus', updateSearchSuggestions);
        searchBox.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowDown') {
            event.preventDefault();
            moveSearchSuggestion(1);
          } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            moveSearchSuggestion(-1);
          } else if (event.key === 'Escape') {
            closeSearchSuggestions();
          }
        });
        suggestions.addEventListener('click', (event) => {
          const item = event.target.closest('.suggestion-item');
          if (item) selectSearchSuggestion(item.dataset.value);
        });
        suggestions.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            const item = event.target.closest('.suggestion-item');
            if (item) selectSearchSuggestion(item.dataset.value);
          } else if (event.key === 'ArrowDown') {
            event.preventDefault();
            moveSearchSuggestion(1);
          } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            moveSearchSuggestion(-1);
          } else if (event.key === 'Escape') {
            closeSearchSuggestions();
            searchBox.focus();
          }
        });
        document.addEventListener('click', (event) => {
          if (!event.target.closest('.search-field')) closeSearchSuggestions();
        });
        updateSearchSuggestions();
        closeSearchSuggestions();
        renderResults();
      }

      function getCommonSkills(results) {
        if (results.length === 0) return new Set();
        const [first, ...rest] = results.map((deviation) => new Set(deviation.skills.map(normalize)));
        for (const skill of [...first]) {
          if (!rest.every((set) => set.has(skill))) first.delete(skill);
        }
        return first;
      }

      function getSearchedSkillSet(term) {
        if (!term) return new Set();
        return new Set(fullSkillList.filter((skill) => hasText(skill, term)).map(normalize));
      }

      function renderResults() {
        const searchTerm = document.getElementById('resultSearchBox').value.trim();
        const mode = document.querySelector('input[name="searchMode"]:checked').value;
        const layout = document.querySelector('input[name="layoutMode"]:checked').value;
        const resultsElement = document.getElementById('results');
        const countElement = document.getElementById('resultCount');

        resultsElement.className = `results-grid ${layout} mode-${mode}`;
        document.querySelector('.legend-inline').hidden = mode !== 'skill';

        if (!searchTerm) {
          countElement.textContent = 'Enter a search term.';
          resultsElement.innerHTML = '<div class="empty-state">Search a deviation to see its skills, or search a skill to see every compatible deviation.</div>';
          return;
        }

        const matched = deviations.filter((deviation) => {
          if (mode === 'deviation') {
            return hasText(deviation.name, searchTerm);
          }
          return deviation.skills.some((skill) => hasText(skill, searchTerm));
        });

        const commonSkills = getCommonSkills(matched);
        const searchedSkills = mode === 'skill' ? getSearchedSkillSet(searchTerm) : new Set();

        countElement.textContent = `${matched.length} result${matched.length === 1 ? '' : 's'} for ${mode}: “${searchTerm}”`;

        if (matched.length === 0) {
          resultsElement.innerHTML = '<div class="empty-state">No matching deviations. Either it does not exist here yet, or the spelling is being very Once Human about it.</div>';
          return;
        }

        resultsElement.innerHTML = matched
          .map((deviation) => renderResultCard(deviation, commonSkills, searchedSkills, mode))
          .join('');
      }

      function renderResultCard(deviation, commonSkills, searchedSkills, mode) {
        const skillItems = deviation.skills
          .map((skill) => {
            const normalized = normalize(skill);
            const isSearched = searchedSkills.has(normalized);
            const isCommon = commonSkills.has(normalized);
            const classes = ['skill-chip'];
            if (isCommon) classes.push('common');
            if (isSearched) classes.push('searched');
            return `<span class="${classes.join(' ')}">${escapeHtml(skill)}</span>`;
          })
          .join('');

        return `
          <article class="result-card ${mode === 'deviation' ? 'deviation-result' : 'skill-result'}">
            <div class="result-header">
              <img src="${escapeHtml(deviation.image)}" alt="${escapeHtml(deviation.name)}" loading="lazy" />
              <h2>${escapeHtml(deviation.name)}</h2>
            </div>
            <div class="skill-list">${skillItems}</div>
          </article>`;
      }

      function setEditorStatus(message, type = '') {
        const status = document.getElementById('editorStatus');
        status.textContent = message;
        status.className = `editor-status ${type}`.trim();
      }

      function setEditorLocked(locked, message = '') {
        editorLocked = locked;
        const unlockButton = document.getElementById('unlockEditorButton');
        unlockButton.textContent = locked ? 'Unlock editor' : 'Lock editor';
        unlockButton.setAttribute('aria-pressed', String(!locked));

        const editableSelectors = [
          '#editorDeviationName',
          '#editorDeviationImage',
          '#newSkillName',
          '#addDeviationButton',
          '#updateDeviationButton',
          '#removeDeviationButton',
          '#addSkillButton',
          '#removeSkillButton',
          '#saveDatabaseButton',
          '.shop-checkbox',
          '.association-checkbox'
        ];

        document.querySelectorAll(editableSelectors.join(',')).forEach((element) => {
          element.disabled = locked;
        });

        if (message) setEditorStatus(message, locked ? '' : 'ok');
      }

      function requireUnlocked() {
        if (!editorLocked) return true;
        setEditorStatus('Editor is locked. Unlock it with an edit key first.', 'error');
        return false;
      }

      function getDeviationByName(name) {
        return deviations.find((deviation) => deviation.name === name) || null;
      }

      function populateEditor() {
        const select = document.getElementById('editorDeviationSelect');
        const current = select.value || deviations[0]?.name || '';
        select.innerHTML = deviations
          .map((deviation) => `<option value="${escapeHtml(deviation.name)}">${escapeHtml(deviation.name)}</option>`)
          .join('');
        select.value = deviations.some((deviation) => deviation.name === current) ? current : deviations[0]?.name || '';
        renderSelectedDeviationEditor();
        renderSkillAssociations();
      }

      function renderSelectedDeviationEditor() {
        const deviation = getDeviationByName(document.getElementById('editorDeviationSelect').value);
        document.getElementById('editorDeviationName').value = deviation?.name || '';
        document.getElementById('editorDeviationImage').value = deviation?.image || '';
      }

      function renderSkillAssociations() {
        const deviation = getDeviationByName(document.getElementById('editorDeviationSelect').value);
        const assigned = new Set((deviation?.skills || []).map(normalize));
        const container = document.getElementById('skillAssociationList');
        container.innerHTML = fullSkillList.map((skill) => {
          const checked = assigned.has(normalize(skill)) ? 'checked' : '';
          const disabled = editorLocked ? 'disabled' : '';
          return `<label class="skill-check"><input type="checkbox" class="association-checkbox" value="${escapeHtml(skill)}" ${checked} ${disabled} /> <span>${escapeHtml(skill)}</span></label>`;
        }).join('');
      }

      function updateSelectedAssociations() {
        if (!requireUnlocked()) return;
        const deviation = getDeviationByName(document.getElementById('editorDeviationSelect').value);
        if (!deviation) return;
        deviation.skills = [...document.querySelectorAll('.association-checkbox:checked')]
          .map((checkbox) => checkbox.value)
          .sort((a, b) => a.localeCompare(b));
        renderResults();
      }

      function selectedShops() {
        return [...document.querySelectorAll('.shop-checkbox:checked')].map((checkbox) => checkbox.value);
      }

      function addSkillToDeviation() {
        if (!requireUnlocked()) return;
        const name = document.getElementById('newSkillName').value.trim();
        const deviation = getDeviationByName(document.getElementById('editorDeviationSelect').value);
        if (!name || !deviation) return setEditorStatus('Pick a deviation and enter a skill name.', 'error');

        if (!deviation.skills.some((skill) => normalize(skill) === normalize(name))) deviation.skills.push(name);
        for (const shop of selectedShops()) {
          if (!shops[shop].some((skill) => normalize(skill) === normalize(name))) shops[shop].push(name);
          shops[shop].sort((a, b) => a.localeCompare(b));
        }
        document.getElementById('newSkillName').value = '';
        refreshRenderedData();
        setEditorStatus(`Added/associated ${name} with ${deviation.name}. Save DB when done.`, 'ok');
      }

      function removeSelectedSkillGlobally() {
        if (!requireUnlocked()) return;
        const checked = document.querySelector('.association-checkbox:checked');
        const skillName = checked?.value || selectedGlobalSkill;
        if (!skillName) return setEditorStatus('Select a skill checkbox first.', 'error');
        if (!confirm(`Remove ${skillName} from every deviation and shop list?`)) return;
        for (const deviation of deviations) deviation.skills = deviation.skills.filter((skill) => normalize(skill) !== normalize(skillName));
        for (const shop of Object.keys(shops)) shops[shop] = shops[shop].filter((skill) => normalize(skill) !== normalize(skillName));
        refreshRenderedData();
        setEditorStatus(`Removed ${skillName} globally. Save DB when done.`, 'ok');
      }

      function addDeviation() {
        if (!requireUnlocked()) return;
        const name = document.getElementById('editorDeviationName').value.trim();
        const image = document.getElementById('editorDeviationImage').value.trim();
        if (!name) return setEditorStatus('Deviation name is required.', 'error');
        if (deviations.some((deviation) => normalize(deviation.name) === normalize(name))) {
          return setEditorStatus('That deviation already exists.', 'error');
        }
        deviations.push({ name, image, skills: [] });
        deviations.sort((a, b) => a.name.localeCompare(b.name));
        refreshRenderedData();
        document.getElementById('editorDeviationSelect').value = name;
        renderSelectedDeviationEditor();
        renderSkillAssociations();
        setEditorStatus(`Added ${name}. Save DB when done.`, 'ok');
      }

      function updateDeviation() {
        if (!requireUnlocked()) return;
        const oldName = document.getElementById('editorDeviationSelect').value;
        const deviation = getDeviationByName(oldName);
        if (!deviation) return;
        const newName = document.getElementById('editorDeviationName').value.trim();
        if (!newName) return setEditorStatus('Deviation name is required.', 'error');
        if (oldName !== newName && deviations.some((item) => normalize(item.name) === normalize(newName))) {
          return setEditorStatus('Another deviation already uses that name.', 'error');
        }
        deviation.name = newName;
        deviation.image = document.getElementById('editorDeviationImage').value.trim();
        deviations.sort((a, b) => a.name.localeCompare(b.name));
        refreshRenderedData();
        document.getElementById('editorDeviationSelect').value = newName;
        setEditorStatus(`Updated ${newName}. Save DB when done.`, 'ok');
      }

      function removeDeviation() {
        if (!requireUnlocked()) return;
        const name = document.getElementById('editorDeviationSelect').value;
        if (!name || !confirm(`Remove deviation ${name}?`)) return;
        database.deviations = deviations.filter((deviation) => deviation.name !== name);
        refreshRenderedData();
        setEditorStatus(`Removed ${name}. Save DB when done.`, 'ok');
      }

      async function toggleEditorLock() {
        if (!editorLocked) {
          setEditorLocked(true, 'Editor locked.');
          return;
        }

        const key = prompt('Enter edit key', editKey || '');
        if (!key) return;
        try {
          const response = await fetch('/api/edit-keys', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'validate', key })
          });
          const result = await response.json();
          if (!result.ok) return setEditorStatus('Invalid edit key.', 'error');
          editKey = key;
          localStorage.setItem('skillMutagenEditKey', key);
          setEditorLocked(false, 'Editor unlocked.');
        } catch (error) {
          setEditorStatus(`Could not validate key: ${error.message}`, 'error');
        }
      }

      async function saveDatabase() {
        if (!requireUnlocked()) return;
        updateSelectedAssociations();
        if (!editKey) return setEditorStatus('Unlock the editor with an edit key first.', 'error');
        try {
          const response = await fetch('/api/database', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Edit-Key': editKey },
            body: JSON.stringify({ database })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
          setEditorStatus(`Saved ${result.deviationCount} deviations and ${result.skillCount} skills.`, 'ok');
          document.getElementById('databaseStatus').textContent = 'Database source: Cloudflare D1 (just saved)';
        } catch (error) {
          setEditorStatus(`Save failed: ${error.message}`, 'error');
        }
      }

      function initEditor() {
        document.getElementById('editorDeviationSelect').addEventListener('change', () => {
          renderSelectedDeviationEditor();
          renderSkillAssociations();
        });
        document.getElementById('skillAssociationList').addEventListener('change', updateSelectedAssociations);
        document.getElementById('skillAssociationList').addEventListener('click', (event) => {
          const checkbox = event.target.closest('.association-checkbox');
          if (checkbox) selectedGlobalSkill = checkbox.value;
        });
        document.getElementById('addSkillButton').addEventListener('click', addSkillToDeviation);
        document.getElementById('removeSkillButton').addEventListener('click', removeSelectedSkillGlobally);
        document.getElementById('addDeviationButton').addEventListener('click', addDeviation);
        document.getElementById('updateDeviationButton').addEventListener('click', updateDeviation);
        document.getElementById('removeDeviationButton').addEventListener('click', removeDeviation);
        document.getElementById('unlockEditorButton').addEventListener('click', toggleEditorLock);
        document.getElementById('saveDatabaseButton').addEventListener('click', saveDatabase);
        document.getElementById('reloadDatabaseButton').addEventListener('click', async () => {
          await loadHostedDatabase();
          refreshRenderedData();
          setEditorLocked(true, 'Database reloaded. Editor locked.');
        });
        setEditorLocked(true, editKey ? 'Editor locked. Saved edit key available for unlock.' : 'Editor locked.');
      }

      async function initApp() {
        initTheme();
        initTabs();
        await loadHostedDatabase();
        buildMatrix();
        initMatrixSearch();
        initResultSearch();
        initEditor();
        populateEditor();
      }
      initApp();
    </script>
  </body>
</html>
