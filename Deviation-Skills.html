<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Mutagen by Deviation & Shop</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #252525;
        --panel: #303030;
        --panel-2: #383838;
        --border: #555;
        --text: #e8e8e8;
        --muted: #b8b8b8;
        --check: #4a6a4a;
        --check-dot: #8bc34a;
        --searched: #ffb000;
        --searched-bg: rgba(255, 176, 0, 0.28);
        --common: #ae7dff;
        --common-bg: rgba(174, 125, 255, 0.22);
        --skill-highlight: rgba(255, 105, 180, 0.5);
        --deviation-highlight: rgba(147, 112, 219, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Quicksand', Arial, sans-serif;
      }

      .page-shell {
        width: min(1600px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 20px 0 36px;
      }

      h1 {
        margin: 0 0 16px;
        text-align: center;
        font-size: 24px;
        font-weight: 700;
      }

      .tabs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 18px;
      }

      .tab-button,
      .control-button,
      .toggle-pill input + span {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      }

      .tab-button {
        padding: 10px 18px;
        font-weight: 700;
      }

      .tab-button:hover,
      .control-button:hover,
      .toggle-pill input + span:hover {
        background: #3d3d3d;
      }

      .tab-button.active,
      .toggle-pill input:checked + span {
        border-color: var(--searched);
        background: rgba(255, 176, 0, 0.16);
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      .panel-card {
        background: rgba(48, 48, 48, 0.72);
        border: 1px solid #444;
        border-radius: 14px;
        padding: 16px;
      }

      .matrix-search-container {
        margin: 0 auto 16px;
        max-width: 640px;
        text-align: center;
      }

      input[type='search'] {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        background: #3a3a3a;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        font-family: inherit;
      }

      input[type='search']:focus,
      select:focus {
        outline: none;
        border-color: #888;
        box-shadow: 0 0 0 2px rgba(136, 136, 136, 0.2);
      }

      table {
        border-collapse: collapse;
        font-family: 'Quicksand', Arial, sans-serif;
        font-size: 12px;
        margin: 0 auto;
        border: 1px solid var(--border);
      }

      th,
      td {
        border: 1px solid var(--border);
        text-align: center;
        padding: 4px;
        vertical-align: middle;
      }

      th.skill-header {
        height: 200px;
        width: 24px;
        vertical-align: bottom;
        position: relative;
        padding: 0;
        cursor: pointer;
      }

      .rotated {
        writing-mode: vertical-lr;
        transform: rotate(180deg);
        white-space: nowrap;
        font-weight: normal;
        display: block;
        padding: 6px 4px;
        text-align: center;
        font-size: 11px;
      }

      th.deviation,
      td.deviation {
        width: 170px;
        text-align: left;
        font-weight: 700;
        padding: 8px;
        font-size: 14px;
        background-color: #3a3a3a;
      }

      td.deviation {
        cursor: pointer;
      }

      .matrix-dev-cell {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .matrix-dev-cell img {
        width: 34px;
        height: 34px;
        object-fit: contain;
        border-radius: 6px;
        background: #242424;
      }

      .check {
        background-color: var(--check);
        position: relative;
      }

      .circle {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background-color: var(--check-dot);
        border: 1px solid #6a983a;
      }

      .cat-skill {
        background-color: rgba(170, 170, 170, 0.2);
      }
      .dino-skill {
        background-color: rgba(255, 140, 102, 0.2);
      }
      .snow-skill {
        background-color: rgba(102, 178, 255, 0.2);
      }
      .wish-skill {
        background-color: rgba(255, 204, 102, 0.2);
      }
      .multi-skill {
        background: linear-gradient(
          45deg,
          rgba(170, 170, 170, 0.2),
          rgba(255, 140, 102, 0.2),
          rgba(102, 178, 255, 0.2),
          rgba(255, 204, 102, 0.2)
        );
      }
      .unlisted-skill {
        background-color: #333;
      }

      .skill-highlight {
        background-color: var(--skill-highlight) !important;
      }
      .deviation-highlight {
        background-color: var(--deviation-highlight) !important;
      }

      .shop-legend {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 0;
        font-size: 12px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .legend-color {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      .cat-legend {
        background: rgba(170, 170, 170, 0.3);
      }
      .dino-legend {
        background: rgba(255, 140, 102, 0.3);
      }
      .snow-legend {
        background: rgba(102, 178, 255, 0.3);
      }
      .wish-legend {
        background: rgba(255, 204, 102, 0.3);
      }

      .search-hidden {
        opacity: 0.2;
        transition: opacity 0.2s ease-out;
      }
      .search-visible {
        opacity: 1;
        transition: opacity 0.2s ease-out;
      }

      .search-tools {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        align-items: end;
        margin-bottom: 16px;
      }

      .field label,
      .toggle-group-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .toggle-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toggle-pill input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .toggle-pill input + span {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 8px 12px;
        user-select: none;
      }

      .result-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .legend-inline {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: flex-end;
      }

      .legend-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }

      .legend-swatch.searched {
        background: var(--searched-bg);
        border-color: var(--searched);
      }

      .legend-swatch.common {
        background: var(--common-bg);
        border-color: var(--common);
      }

      .results-grid {
        display: grid;
        gap: 12px;
      }

      .results-grid.vertical {
        grid-template-columns: 1fr;
      }

      .results-grid.horizontal {
        grid-auto-flow: column;
        grid-auto-columns: minmax(280px, 360px);
        overflow-x: auto;
        padding-bottom: 8px;
      }

      .result-card {
        min-width: 0;
        border: 1px solid #4a4a4a;
        border-radius: 14px;
        background: #303030;
        padding: 12px;
      }

      .result-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .result-header img {
        width: 58px;
        height: 58px;
        object-fit: contain;
        border-radius: 10px;
        background: #242424;
        border: 1px solid #444;
      }

      .result-header h2 {
        margin: 0;
        font-size: 18px;
      }

      .skill-list {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .skill-chip {
        border: 1px solid #555;
        border-radius: 999px;
        padding: 5px 9px;
        background: #262626;
        font-size: 12px;
        line-height: 1.1;
      }

      .skill-chip.common {
        border-color: var(--common);
        background: var(--common-bg);
        box-shadow: inset 0 0 0 1px rgba(174, 125, 255, 0.18);
      }

      .skill-chip.searched {
        border-color: var(--searched);
        background: var(--searched-bg);
        color: #ffe3a4;
        font-weight: 800;
        box-shadow: inset 0 0 0 1px rgba(255, 176, 0, 0.28);
      }

      .empty-state {
        border: 1px dashed #5a5a5a;
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .search-tools {
          grid-template-columns: 1fr;
        }

        .result-meta {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <h1>Once Human Skill Mutagen</h1>

      <nav class="tabs" aria-label="Views">
        <button class="tab-button active" type="button" data-tab="matrix-panel">Current Table</button>
        <button class="tab-button" type="button" data-tab="search-panel">Deviation / Skill Search</button>
      </nav>

      <section id="matrix-panel" class="tab-panel active">
        <div class="matrix-search-container">
          <input
            type="search"
            id="matrixSearchBox"
            placeholder="Filter current table by skills or deviations..."
            autocomplete="off"
          />
        </div>

        <div style="overflow-x: auto">
          <table id="skillMatrix">
            <thead>
              <tr>
                <th class="deviation">
                  <div class="shop-legend">
                    <div class="legend-item"><div class="legend-color cat-legend"></div><span>Cat Shop</span></div>
                    <div class="legend-item"><div class="legend-color dino-legend"></div><span>Dino Shop</span></div>
                    <div class="legend-item"><div class="legend-color snow-legend"></div><span>Snow Shop</span></div>
                    <div class="legend-item"><div class="legend-color wish-legend"></div><span>Wish Shop</span></div>
                  </div>
                </th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="search-panel" class="tab-panel">
        <div class="panel-card">
          <div class="search-tools">
            <div class="field">
              <label for="resultSearchBox">Search</label>
              <input
                type="search"
                id="resultSearchBox"
                list="searchSuggestions"
                placeholder="Type a deviation or skill..."
                autocomplete="off"
              />
              <datalist id="searchSuggestions"></datalist>
            </div>

            <div>
              <div class="toggle-group-label">Search by</div>
              <div class="toggle-group" role="radiogroup" aria-label="Search mode">
                <label class="toggle-pill"><input type="radio" name="searchMode" value="deviation" checked /><span>Deviation</span></label>
                <label class="toggle-pill"><input type="radio" name="searchMode" value="skill" /><span>Skill</span></label>
              </div>
            </div>

            <div>
              <div class="toggle-group-label">Layout</div>
              <div class="toggle-group" role="radiogroup" aria-label="Result layout">
                <label class="toggle-pill"><input type="radio" name="layoutMode" value="vertical" checked /><span>Vertical</span></label>
                <label class="toggle-pill"><input type="radio" name="layoutMode" value="horizontal" /><span>Horizontal</span></label>
              </div>
            </div>
          </div>

          <div class="result-meta">
            <div id="resultCount">Enter a search term.</div>
            <div class="legend-inline">
              <span class="legend-chip"><span class="legend-swatch searched"></span>Searched skill</span>
              <span class="legend-chip"><span class="legend-swatch common"></span>Common to all results</span>
            </div>
          </div>

          <div id="results" class="results-grid vertical"></div>
        </div>
      </section>
    </main>

    <script src="data/deviation-database.js"></script>
    <script>
      'use strict';

      const database = window.DEVIATION_SKILL_DATABASE;
      const deviations = database.deviations;
      const shops = database.shops;
      const allSkills = [...new Set(Object.values(shops).flat())];
      const fullSkillList = [
        ...new Set([...allSkills, ...deviations.flatMap((deviation) => deviation.skills)]),
      ];

      const normalize = (value) => value.toLowerCase().replace(/[^a-z0-9]+/g, '');
      const fuzzy = (value) => value.toLowerCase().trim();
      const hasText = (value, term) => fuzzy(value).includes(fuzzy(term));

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getShopClasses(skill) {
        const classes = [];
        if (shops.cat.includes(skill)) classes.push('cat-skill');
        if (shops.dino.includes(skill)) classes.push('dino-skill');
        if (shops.snow.includes(skill)) classes.push('snow-skill');
        if (shops.wish.includes(skill)) classes.push('wish-skill');
        return classes;
      }

      function applyShopClass(element, skill) {
        const classes = getShopClasses(skill);
        if (classes.length > 1) {
          element.classList.add('multi-skill');
        } else if (classes.length === 1) {
          element.classList.add(classes[0]);
        } else {
          element.classList.add('unlisted-skill');
        }
      }

      function initTabs() {
        document.querySelectorAll('.tab-button').forEach((button) => {
          button.addEventListener('click', () => {
            document.querySelectorAll('.tab-button').forEach((item) => item.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach((panel) => panel.classList.remove('active'));
            button.classList.add('active');
            document.getElementById(button.dataset.tab).classList.add('active');
          });
        });
      }

      function buildMatrix() {
        const table = document.getElementById('skillMatrix');
        const theadRow = table.querySelector('thead tr');
        const tbody = table.querySelector('tbody');

        fullSkillList.forEach((skill, index) => {
          const th = document.createElement('th');
          th.className = 'skill-header';
          applyShopClass(th, skill);
          th.innerHTML = `<div class="rotated">${escapeHtml(skill)}</div>`;
          th.addEventListener('click', () => highlightSkillColumn(index, th));
          theadRow.appendChild(th);
        });

        deviations.forEach((deviation) => {
          const row = document.createElement('tr');
          const devCell = document.createElement('td');
          devCell.className = 'deviation';
          devCell.innerHTML = `
            <div class="matrix-dev-cell">
              <img src="${escapeHtml(deviation.image)}" alt="" loading="lazy" />
              <span>${escapeHtml(deviation.name)}</span>
            </div>`;
          devCell.addEventListener('click', () => highlightDeviation(row, deviation));
          row.appendChild(devCell);

          const skillSet = new Set(deviation.skills.map(normalize));
          fullSkillList.forEach((skill) => {
            const cell = document.createElement('td');
            if (skillSet.has(normalize(skill))) {
              cell.classList.add('check');
              cell.innerHTML = '<div class="circle"></div>';
            }
            row.appendChild(cell);
          });

          tbody.appendChild(row);
        });
      }

      function clearAllHighlights() {
        document.querySelectorAll('#skillMatrix tbody tr').forEach((row) => {
          row.classList.remove('deviation-highlight');
        });
        document.querySelectorAll('#skillMatrix tbody td').forEach((cell) => {
          cell.classList.remove('skill-highlight', 'deviation-highlight');
        });
        document.querySelectorAll('#skillMatrix thead th.skill-header').forEach((th) => {
          th.classList.remove('skill-highlight');
        });
      }

      function highlightSkillColumn(index, header) {
        clearAllHighlights();
        document.querySelectorAll(`#skillMatrix tbody tr td:nth-child(${index + 2})`).forEach((cell) => {
          cell.classList.add('skill-highlight');
          if (cell.querySelector('.circle')) {
            cell.parentElement.classList.add('deviation-highlight');
          }
        });
        header.classList.add('skill-highlight');
      }

      function highlightDeviation(row, deviation) {
        clearAllHighlights();
        row.classList.add('deviation-highlight');
        const theadRow = document.querySelector('#skillMatrix thead tr');
        const deviationSkillSet = new Set(deviation.skills.map(normalize));
        fullSkillList.forEach((skill, index) => {
          if (!deviationSkillSet.has(normalize(skill))) return;
          const header = theadRow.children[index + 1];
          if (header) header.classList.add('skill-highlight');
          document.querySelectorAll(`#skillMatrix tbody tr td:nth-child(${index + 2})`).forEach((cell) => {
            cell.classList.add('skill-highlight');
          });
        });
      }

      function initMatrixSearch() {
        const searchBox = document.getElementById('matrixSearchBox');
        const thList = Array.from(document.querySelectorAll('#skillMatrix thead th.skill-header'));
        const thSkillNames = thList.map((th) => th.querySelector('.rotated').textContent.toLowerCase());

        const setVisible = (element, visible) => {
          element.classList.toggle('search-visible', visible);
          element.classList.toggle('search-hidden', !visible);
        };

        function updateSearch() {
          const searchTerm = searchBox.value.toLowerCase().trim();
          if (!searchTerm) {
            document.querySelectorAll('#skillMatrix tbody tr').forEach((row) => setVisible(row, true));
            thList.forEach((th) => setVisible(th, true));
            return;
          }

          const skillMatches = new Set(thSkillNames.filter((name) => name.includes(searchTerm)));
          const isSkillQuery = skillMatches.size > 0;

          document.querySelectorAll('#skillMatrix tbody tr').forEach((row) => {
            const deviationName = row.querySelector('td.deviation').textContent.toLowerCase();
            const rowSkills = Array.from(row.querySelectorAll('td .circle')).map((circle) => {
              const colIndex = circle.closest('td').cellIndex;
              return document
                .querySelector(`#skillMatrix thead th:nth-child(${colIndex + 1}) .rotated`)
                .textContent.toLowerCase();
            });

            const matchesDeviation = deviationName.includes(searchTerm);
            const matchesSkillLoose = rowSkills.some((skill) => skill.includes(searchTerm));
            const matchesSkillDirect = rowSkills.some((skill) => skillMatches.has(skill));
            setVisible(row, isSkillQuery ? matchesSkillDirect || matchesDeviation : matchesDeviation || matchesSkillLoose);
          });

          const visibleSkillSet = new Set();
          document.querySelectorAll('#skillMatrix tbody tr.search-visible').forEach((row) => {
            Array.from(row.querySelectorAll('td .circle')).forEach((circle) => {
              const colIndex = circle.closest('td').cellIndex;
              visibleSkillSet.add(
                document.querySelector(`#skillMatrix thead th:nth-child(${colIndex + 1}) .rotated`).textContent.toLowerCase()
              );
            });
          });

          thList.forEach((th, index) => {
            const name = thSkillNames[index];
            setVisible(th, isSkillQuery ? skillMatches.has(name) : visibleSkillSet.has(name));
          });
        }

        let searchTimeout;
        searchBox.addEventListener('input', () => {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(updateSearch, 120);
        });
      }

      function initResultSearch() {
        const searchBox = document.getElementById('resultSearchBox');
        const suggestions = document.getElementById('searchSuggestions');
        const inputs = document.querySelectorAll('input[name="searchMode"], input[name="layoutMode"]');

        suggestions.innerHTML = [...deviations.map((item) => item.name), ...fullSkillList]
          .sort((a, b) => a.localeCompare(b))
          .map((value) => `<option value="${escapeHtml(value)}"></option>`)
          .join('');

        inputs.forEach((input) => input.addEventListener('change', renderResults));
        searchBox.addEventListener('input', renderResults);
        renderResults();
      }

      function getCommonSkills(results) {
        if (results.length === 0) return new Set();
        const [first, ...rest] = results.map((deviation) => new Set(deviation.skills.map(normalize)));
        for (const skill of [...first]) {
          if (!rest.every((set) => set.has(skill))) first.delete(skill);
        }
        return first;
      }

      function getSearchedSkillSet(term) {
        if (!term) return new Set();
        return new Set(fullSkillList.filter((skill) => hasText(skill, term)).map(normalize));
      }

      function renderResults() {
        const searchTerm = document.getElementById('resultSearchBox').value.trim();
        const mode = document.querySelector('input[name="searchMode"]:checked').value;
        const layout = document.querySelector('input[name="layoutMode"]:checked').value;
        const resultsElement = document.getElementById('results');
        const countElement = document.getElementById('resultCount');

        resultsElement.className = `results-grid ${layout}`;

        if (!searchTerm) {
          countElement.textContent = 'Enter a search term.';
          resultsElement.innerHTML = '<div class="empty-state">Search a deviation to see its skills, or search a skill to see every compatible deviation.</div>';
          return;
        }

        const matched = deviations.filter((deviation) => {
          if (mode === 'deviation') {
            return hasText(deviation.name, searchTerm);
          }
          return deviation.skills.some((skill) => hasText(skill, searchTerm));
        });

        const commonSkills = getCommonSkills(matched);
        const searchedSkills = mode === 'skill' ? getSearchedSkillSet(searchTerm) : new Set();

        countElement.textContent = `${matched.length} result${matched.length === 1 ? '' : 's'} for ${mode}: “${searchTerm}”`;

        if (matched.length === 0) {
          resultsElement.innerHTML = '<div class="empty-state">No matching deviations. Either it does not exist here yet, or the spelling is being very Once Human about it.</div>';
          return;
        }

        resultsElement.innerHTML = matched
          .map((deviation) => renderResultCard(deviation, commonSkills, searchedSkills))
          .join('');
      }

      function renderResultCard(deviation, commonSkills, searchedSkills) {
        const skillItems = deviation.skills
          .map((skill) => {
            const normalized = normalize(skill);
            const isSearched = searchedSkills.has(normalized);
            const isCommon = commonSkills.has(normalized);
            const classes = ['skill-chip'];
            if (isCommon) classes.push('common');
            if (isSearched) classes.push('searched');
            return `<span class="${classes.join(' ')}">${escapeHtml(skill)}</span>`;
          })
          .join('');

        return `
          <article class="result-card">
            <div class="result-header">
              <img src="${escapeHtml(deviation.image)}" alt="${escapeHtml(deviation.name)}" loading="lazy" />
              <h2>${escapeHtml(deviation.name)}</h2>
            </div>
            <div class="skill-list">${skillItems}</div>
          </article>`;
      }

      initTabs();
      buildMatrix();
      initMatrixSearch();
      initResultSearch();
    </script>
  </body>
</html>
